name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      ARTIFACT_REGISTRY_REPOSITORY: ${{ secrets.ARTIFACT_REGISTRY_REPOSITORY }}
      CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
      IMAGE_NAME: chess-server
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy configuration
        run: |
          required=(GCP_PROJECT_ID GCP_REGION ARTIFACT_REGISTRY_REPOSITORY CLOUD_RUN_SERVICE)
          for var in "${required[@]}"; do
            if [ -z "${!var}" ]; then
              echo "Missing required secret: $var"
              exit 1
            fi
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${IMAGE_NAME}:${IMAGE_TAG}"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.IMAGE_URI }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Prisma migrations
        if: ${{ hashFiles('packages/server/prisma/schema.prisma') != '' && secrets.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @chess/server exec prisma migrate deploy

      - name: Health check
        env:
          HEALTHCHECK_PATH: ${{ vars.HEALTHCHECK_PATH || '/health' }}
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          PRIMARY_URL="${SERVICE_URL}${HEALTHCHECK_PATH}"
          FALLBACK_URL="${SERVICE_URL}/"
          echo "Checking $PRIMARY_URL"
          for i in {1..20}; do
            PRIMARY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PRIMARY_URL" || true)
            FALLBACK_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$FALLBACK_URL" || true)
            if [ "$PRIMARY_STATUS" = "200" ] || [ "$FALLBACK_STATUS" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i/20 failed: primary=$PRIMARY_STATUS fallback=$FALLBACK_STATUS"
            sleep 10
          done
          echo "Health check failed"
          exit 1
